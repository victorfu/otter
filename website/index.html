<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Otter — Speech to text for clinical work</title>
		<meta
			name="description"
			content="Dictate notes or record a consultation, and Otter turns it into text on your own computer. Tell it your terms and it spells them your way. Free and open source." />
		<link rel="author" href="https://github.com/victorfu" />
		<meta name="keywords" content="medical transcription, medical dictation, clinical notes, speech to text, dictation, local transcription, whisper" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e1e" />

		<!-- Apply the system theme before first paint to avoid a flash -->
		<script>
			;(function () {
				var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
				document.documentElement.classList.toggle('dark', isDark)
				document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
			})()
		</script>
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://victorfu.github.io/otter/" />
