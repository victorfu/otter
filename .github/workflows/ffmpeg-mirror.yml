# Mirror the pinned upstream FFmpeg archives, unchanged, into this repository's
# $ffmpeg_tag release (upload-ffmpeg in the root chorefile). Run it by hand after
# changing the FFmpeg pins there; a rerun re-uploads the same verified bytes.
#   gh workflow run ffmpeg-mirror.yml
name: FFmpeg mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # www.osxexperts.net publishes an AAAA record, runners have no IPv6 route, and the
      # download fails with "Network unreachable" instead of falling back to IPv4.
      # With IPv6 off, the resolver returns only the A record.
      - name: Prefer IPv4
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 net.ipv6.conf.default.disable_ipv6=1
          curl -4 -sSfI https://www.osxexperts.net/ffmpeg80arm.zip | head -1

      - uses: getchore/setup-chore@v1
        with:
          version: v1.6.0

      - name: Mirror and upload
        env:
          GH_TOKEN: ${{ github.token }}
          # The chorefile reads `rustc --print host-tuple` on load; the runner's stable
          # toolchain answers it without installing the version rust-toolchain.toml pins.
          RUSTUP_TOOLCHAIN: stable
        run: chore upload-ffmpeg
