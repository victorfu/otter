# Copy the runtime model files, unchanged, into this repository's $models_tag
# release (upload-models in the root chorefile). Run it by hand after changing the
# model pins there; a rerun re-uploads the same verified bytes.
#   gh workflow run models-mirror.yml
name: Models mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: getchore/setup-chore@v1
        with:
          version: v1.6.0

      - name: Mirror and upload
        env:
          GH_TOKEN: ${{ github.token }}
          # The chorefile reads `rustc --print host-tuple` on load; the runner's stable
          # toolchain answers it without installing the version rust-toolchain.toml pins.
          RUSTUP_TOOLCHAIN: stable
        run: chore upload-models
